name: Generate Resume from Markdown

on:
  push:
    branches: [master]
    paths:
      - "resume/RodrigoSobral.md"
      - ".github/build_cv.py"

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v6.0.2

      - name: Compute dynamic placeholders
        run: |
          START_YEAR=2022 START_MONTH=4
          CY=$(date +%Y) CM=$(date +%-m)
          EXP=$(echo "scale=1; (($CY - $START_YEAR) * 12 + ($CM - $START_MONTH)) / 12" | bc)
          sed -i "s/<EXPERIENCE_YEARS>/$EXP/g" resume/RodrigoSobral.md

      - name: Install dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends \
            libpango-1.0-0 libpangocairo-1.0-0 libcairo2 libgdk-pixbuf2.0-0 shared-mime-info
          pip install markdown==3.7 weasyprint==61.2 pydyf==0.9.0

      - name: Build PDF
        run: python .github/build_cv.py --input=resume/RodrigoSobral.md --output=resume/RodrigoSobral.pdf

      - name: Commit and push
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add resume/RodrigoSobral.pdf
          git diff --cached --quiet || git commit -m "ci: rebuild RodrigoSobral.pdf [skip ci]"
          git push